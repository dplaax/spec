# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — chain (event-chain issuance rules)
# File sharding is non-normative; an entry's identity is its id (see README.md).
rules:
  - id: chain.trigger.retention
    status: draft
    class: core
    statement: >-
      A boundary's output MUST be chain-preserving (carrying previousCredential)
      exactly when the execution was triggered by the arrival of a single
      pipeline-conformant predecessor event. Output of an execution with any
      other trigger (timer, window expiry, external push, polling, arrival of a
      non-conformant event) MUST be issued as a chain origin.
    uses: []
    schemas: []
    vectors: [chain-001, chain-002, chain-003]
    notes: >-
      The chain-preserving judgment coincides with the presence of
      previousCredential on the wire. Re-signing a non-conformant credential
      (boundary translation) is a typical chain origin. The criterion is the
      runtime cause of activation, not hindsight observation of how many
      events were consumed.

  - id: chain.trigger.batch-of-one
    status: draft
    class: core
    statement: >-
      Even when a non-event-driven execution happens to consume a single
      pending input, the issuer MUST issue its output as a chain origin.
      Hindsight observation of the consumed event count MUST NOT be used as
      the basis for the chain-preserving judgment.
    uses: [chain.trigger.retention]
    schemas: []
    vectors: [chain-004]
    notes: >-
      A consequence of the "decidability over cleverness" design stance
      (see concept.md). Pinning trigger classification to the runtime cause
      of activation makes the judgment decidable.

  - id: chain.trigger.fan-out
    status: draft
    class: core
    statement: >-
      An issuer MAY issue multiple successor credentials from one
      chain-preserving predecessor event. The linearity constraint bounds each
      credential's predecessor count (at most one); it does not constrain
      forward branching from a single predecessor.
    uses: [chain.trigger.retention]
    schemas: []
    vectors: [chain-005]
    notes: >-
      A join (a credential with multiple predecessors) cannot arise by the
      definition in chain.trigger.retention. The audit-reachable class's
      source commitment (see rules/commitment.yaml) coexists as an audit
      attribute independent of linearity.

  - id: chain.data-flow.continuity
    status: draft
    class: core
    statement: >-
      When a successor credential references a predecessor via
      previousCredential, the successor's inputHash MUST equal the
      predecessor's outputHash. A verifier MUST treat a mismatch as failed
      during chain verification.
    uses: [credential.subject.input-hash, credential.subject.previous-credential]
    schemas: []
    vectors: [chain-006, chain-007]
    notes: >-
      Data-flow continuity (input-output binding): the hashes bind the chain
      to a processing lineage of the same data. Chain origins carry no
      previousCredential and are outside this rule (inputHash presence is
      governed by credential.subject.input-hash).
      Source: drafts/v1_001 conformance section, L2 verification rule
      "Input-output binding"; baked into provin.oss packages/vc as a contract
      (the chain invariant in credential.go / VerifyChain). Resolved the
      unsourced-normativization ledger item on 2026-06-11.
