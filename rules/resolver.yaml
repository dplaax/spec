# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — resolver (VC resolver: hash-keyed content-addressed store)
# ファイル分割は non-normative。entry の identity は id が担う (→ README.md)。
rules:
  - id: resolver.address.form
    status: draft
    class: core
    statement: >-
      VC resolver のキーは sha256:<lowercase-hex> 形式の content hash であり、
      proof を除く credential body の正規化バイト列に対して計算しなければ
      ならない (MUST)。正規化はチェーンリンク (previousCredential) と同一で
      なければならない (MUST)。
    uses: [canon.jcs.base, credential.prev.content-hash]
    schemas: []
    vectors: []
    notes: >-
      resolver キー = 受信 credential から検証器が再計算するチェーンリンク hash、
      が要点 — 同一の正規化を共有しないと resolve 不能になる。
      出典: drafts/v1_002 vc_resolver 節 (Address form)。

  - id: resolver.immutability
    status: draft
    class: core
    statement: >-
      同一の hash キーは一意で不変のバイト列に解決されなければならない (MUST)。
      resolver は同一キーに対して異なる body を返してはならない (MUST NOT)。
      検証器は返却バイト列の hash を再計算し、キーと一致しない応答を拒否
      しなければならない (MUST)。
    uses: [resolver.address.form]
    schemas: []
    vectors: []
    notes: >-
      不変性は暗号学的に強制される — resolver 運用者は信頼主体ではなく、
      内容を偽造できない (可用性のみが運用者の裁量)。expiration / migration /
      operator override による別 body の返却も不変性違反。
      出典: drafts/v1_002 vc_resolver 節 (Immutability invariant / Trust model)。

  - id: resolver.states
    status: draft
    class: core
    statement: >-
      lookup の結果状態は Resolved・Unavailable・NotFound の 3 値である。
      Unavailable は「現在保持していないが不存在は主張しない」、NotFound は
      「不存在の確定的主張」を意味する。検証器は Unavailable を indeterminate、
      NotFound を failed に対応付けなければならない (MUST)。
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: []
    notes: >-
      Unavailable / NotFound の区別が confidence 軸評価の決定論性を支える —
      再試行で解決し得るものと、し得ないものの分離。
      出典: drafts/v1_002 vc_resolver 節 (Lookup interface)。

  - id: resolver.states.no-demotion
    status: draft
    class: core
    statement: >-
      resolver は、一度 Resolved を返した hash を NotFound に遷移させては
      ならない (MUST NOT)。eviction を実装する場合、退避済み body の hash は
      Unavailable に遷移しなければならない (MUST)。
    uses: [resolver.states, resolver.immutability]
    schemas: []
    vectors: []
    notes: >-
      一度解決可能と観測された body は検証可能な履歴の一部 — NotFound への降格は
      「存在しなかった」という偽の確定主張になる。恒久削除 (規制対応等) は
      protocol 外の文書化事項であり、protocol は removed 状態を提供しない。
      出典: drafts/v1_002 vc_resolver 節 (Pool semantics)。

  - id: resolver.batch.shape
    status: draft
    class: core
    statement: >-
      batch lookup の応答は要求と同数・同順の entry 列でなければならない (MUST)。
      各 entry の状態は独立であり、部分可用 (Resolved / Unavailable / NotFound の
      混在) は定義された非エラー状態である。wire profile が一括取得の最適化を
      追加する場合も hash ごとの状態意味論を保存しなければならない (MUST)。
    uses: [resolver.states]
    schemas: []
    vectors: []
    notes: >-
      部分可用は分散 resolver (peer cache / CDN) の自然状態であり、エラーとして
      表面化させると confidence 評価の indeterminate 意味論が壊れる。
      出典: drafts/v1_002 vc_resolver 節 (Batch lookup / Partial availability)。

  - id: resolver.body.encoding
    status: draft
    class: core
    statement: >-
      応答の body は proof を除く credential body の正規化 JSON バイト列であり、
      dplaax 層の wire 既定は base64url (padding なし) とする。wire profile は
      transport 固有のバイト列表現に置換してよい (MAY) が、意味論的等価を
      保たなければならない (MUST)。
    uses: [resolver.address.form]
    schemas: []
    vectors: []
    notes: >-
      バイト列が canonical form そのものであることが要点 — 受領側は
      resolver.immutability の hash 再計算をそのまま適用できる。
      出典: drafts/v1_002 vc_resolver 節 (Partial availability encoding)。
