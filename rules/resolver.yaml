# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — resolver (VC resolver: hash-keyed content-addressed store)
# File split is non-normative. Entry identity is carried by id (→ README.md).
rules:
  - id: resolver.address.form
    status: draft
    class: core
    statement: >-
      The key for a VC resolver is a content hash of the form
      sha256:<lowercase-hex>, computed over the canonicalized byte sequence of
      the credential body excluding the proof, and MUST use the same
      canonicalization as chain links (previousCredential).
    uses: [canon.jcs.base, credential.prev.content-hash]
    schemas: []
    vectors: [resolver-001, resolver-002]
    notes: >-
      The key point is that the resolver key equals the chain-link hash that
      the verifier recomputes from the received credential — if the same
      canonicalization is not shared, resolution fails.
      Source: drafts/v1_002 vc_resolver section (Address form).

  - id: resolver.immutability
    status: draft
    class: core
    statement: >-
      The same hash key MUST resolve to a unique, immutable byte sequence. A
      resolver MUST NOT return different bodies for the same key. A verifier
      MUST recompute the hash of the returned bytes and MUST reject any
      response whose hash does not match the key.
    uses: [resolver.address.form]
    schemas: []
    vectors: [resolver-003]
    notes: >-
      Immutability is cryptographically enforced — the resolver operator is
      not a trust principal and cannot forge content (availability is the only
      operator discretion). Returning a different body via expiration /
      migration / operator override also violates immutability.
      Source: drafts/v1_002 vc_resolver section (Immutability invariant /
      Trust model).

  - id: resolver.states
    status: draft
    class: core
    statement: >-
      A lookup MUST yield one of: Resolved, Unavailable, or NotFound.
      Unavailable means no data is held but non-existence is not asserted;
      NotFound is a definitive non-existence assertion. A verifier MUST map
      Unavailable to indeterminate and NotFound to failed.
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: [resolver-004, resolver-005]
    notes: >-
      The distinction between Unavailable and NotFound underpins the
      determinism of confidence-axis evaluation — it separates what may be
      resolved on retry from what cannot.
      Source: drafts/v1_002 vc_resolver section (Lookup interface).

  - id: resolver.states.no-demotion
    status: draft
    class: core
    statement: >-
      A resolver MUST NOT transition a hash that has previously returned
      Resolved to NotFound. If eviction is implemented, an evicted hash MUST
      transition to Unavailable.
    uses: [resolver.states, resolver.immutability]
    schemas: []
    vectors: [resolver-006]
    notes: >-
      A body that was once observed as resolvable is part of verifiable
      history — demotion to NotFound would be a false definitive claim of
      non-existence. Permanent deletion (e.g. for regulatory compliance) is a
      documented out-of-protocol matter; the protocol provides no removed
      state.
      Source: drafts/v1_002 vc_resolver section (Pool semantics).

  - id: resolver.batch.shape
    status: draft
    class: core
    statement: >-
      A batch response MUST have the same entry count and order as the
      request. Each entry state is independent; partial availability is a
      defined non-error state. A wire profile adding bulk-fetch optimizations
      MUST preserve per-hash state semantics.
    uses: [resolver.states]
    schemas: []
    vectors: [resolver-007]
    notes: >-
      Partial availability is the natural state of a distributed resolver
      (peer cache / CDN); surfacing it as an error would break the
      indeterminate semantics of confidence evaluation.
      Source: drafts/v1_002 vc_resolver section (Batch lookup / Partial
      availability).

  - id: resolver.body.encoding
    status: draft
    class: core
    statement: >-
      A response body is the canonicalized JSON byte sequence of the
      credential body excluding the proof; the dplaax wire default encoding is
      base64url (no padding). A wire profile MAY substitute a transport
      encoding but MUST preserve semantic equivalence.
    uses: [resolver.address.form]
    schemas: []
    vectors: [resolver-008]
    notes: >-
      The key point is that the byte sequence is the canonical form itself —
      the receiver can apply the resolver.immutability hash recomputation
      directly.
      Source: drafts/v1_002 vc_resolver section (Partial availability
      encoding).
