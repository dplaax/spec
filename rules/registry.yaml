# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — registry (schema registry invariants)
# File split is non-normative. Entry identity is carried by id (→ README.md).
rules:
  - id: registry.append-only
    status: draft
    class: core
    statement: >-
      A Schema Registry MUST NOT modify or delete committed entries. Updates
      MUST be new entries with new version identifiers; existing entries MUST
      remain retrievable under their original identifiers. Version identifiers
      within a key MUST NOT be reused.
    uses: []
    schemas: []
    vectors: [registry-001]
    notes: >-
      The format of version identifiers (monotonically increasing integer /
      semver / content hash, etc.) and the minimum retention period are
      profile / operational choices. The committedAt timestamp of an entry is
      a wire-level concern. The source of this rule is the old draft only;
      reconciliation is required once a corresponding implementation appears
      in provin.oss (→ STATUS.md open item).
