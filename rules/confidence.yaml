# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — confidence (検証判定の合成)
# ファイル分割は non-normative。entry の identity は id が担う (→ README.md)。
rules:
  - id: confidence.axes.three-state
    status: draft
    class: core
    statement: >-
      検証器は、各クレデンシャルを署名者真正性 (signer authenticity)・チェーン整合性
      (chain consistency)・データ完全性 (data integrity) の 3 つの規範軸で独立に
      評価し、各軸の結果を failed ⊏ indeterminate ⊏ verified の 3 状態で
      表現しなければならない (MUST)。状態を数値スコアへ変換する計算式は
      規範外であり、profile / アプリケーション側の選択とする。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      indeterminate は「現在の入力では検証を完了できない (後に解決しうる)」の意味
      であり、条件付き成功の意味ではない。旧 draft 系の分類
      (signature / DID resolution / schema の 3 軸、Invalid / Limited / Verified の
      3 状態) は上書きされた — 特に Limited (条件付き成功) と indeterminate は
      別概念で、互換ではない。

  - id: confidence.composition.weakest-link
    status: draft
    class: core
    statement: >-
      検証器は、チェーン内の全クレデンシャルに 3 軸評価を適用し、軸とクレデンシャルの
      全体にわたる最小値 (最弱リンク) を全体結果としなければならない (MUST)。
      いずれか 1 つでも failed があれば、他がすべて verified でも全体結果は
      failed としなければならない (MUST)。
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: []
    notes: ""

  - id: confidence.cryptosuite-lifecycle
    status: draft
    class: core
    statement: >-
      検証器は、cryptosuite の lifecycle 段階 (Active / Deprecated / Sunset) を、
      proof.created の時刻において lifecycle registry に照会して判定しなければ
      ならない (MUST)。Sunset または未登録の cryptosuite は failed としなければ
      ならず (MUST)、Deprecated は注記付き verified として扱う。registry は
      追記のみの公開成果物でなければならない (MUST)。
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: []
    notes: >-
      判定キーは proof.created であり validFrom ではない。registry の背面は
      transparency log (実装選択)。旧 draft にあった追加規範の候補 —
      検証器ごとの cryptosuite allow-list、no-op identifier ("none" 等) の禁止、
      Deprecated の cutoff date 規則 — は未取り込み (→ STATUS.md 未決)。
