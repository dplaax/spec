# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — confidence (verification result composition)
# File split is non-normative. Entry identity is carried by id (→ README.md).
rules:
  - id: confidence.axes.three-state
    status: draft
    class: core
    statement: >-
      A verifier MUST evaluate each credential on three normative axes —
      signer authenticity, chain consistency, and data integrity — expressing
      each result as one of three states: failed ⊏ indeterminate ⊏ verified.
      Score formulas are non-normative.
    uses: []
    schemas: []
    vectors: [confidence-001]
    notes: >-
      indeterminate means "verification cannot be completed with current input
      (may be resolved later)"; it does not mean conditional success. The
      old-draft classification (three axes: signature / DID resolution /
      schema; three states: Invalid / Limited / Verified) is superseded —
      Limited (conditional success) and indeterminate are distinct concepts
      and are not compatible.

  - id: confidence.composition.weakest-link
    status: draft
    class: core
    statement: >-
      A verifier MUST apply three-axis evaluation to every credential in the
      chain and MUST use the minimum (weakest link) across all axes and
      credentials as the aggregate result. If any axis of any credential is
      failed, the aggregate MUST be failed.
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: [confidence-002, confidence-003]
    notes: ""

  - id: confidence.lifecycle.input-semantics
    status: draft
    class: core
    statement: >-
      When the lifecycle input is unavailable (registry unreachable) a verifier
      MUST yield indeterminate, not failed; when it cannot evaluate the
      lifecycle at all it MUST report that coverage as UNSUPPORTED; a Sunset or
      unknown stage MUST yield failed.
    uses: [confidence.cryptosuite-lifecycle, claims.coverage.three-value]
    schemas: []
    vectors: []
    notes: >-
      Distinguishes three lifecycle-input conditions along the coverage and
      truth-state axes (see claims.coverage.three-value): unreachable registry
      is a retryable indeterminate, no evaluator is an UNSUPPORTED coverage, and
      a resolved Sunset/unknown stage is a failed outcome. This is the input to
      the SIGNATURE_ONLY cap in claims.scope.signature-only-cap.

  - id: confidence.cryptosuite-lifecycle
    status: draft
    class: core
    statement: >-
      A verifier evaluating LINEAR_ATTESTATION MUST query the lifecycle registry
      at proof.created for the cryptosuite stage; Sunset or unregistered suites
      MUST yield failed, Deprecated is verified with notation, and the registry
      MUST be append-only.
    uses: [confidence.axes.three-state]
    schemas: []
    vectors: [confidence-004, confidence-005, confidence-006]
    notes: >-
      The evaluation key is proof.created, not validFrom. The registry backend
      is a transparency log (implementation choice). The prohibition on no-op
      identifiers is normativized as signer.cryptosuite.no-op-rejected
      (2026-06-11). The remaining two candidate supplements were not adopted:
      per-verifier cryptosuite allow-lists are an operational matter (no
      normative source text found), and Deprecated cutoff dates are expressible
      via the EffectiveDate of the Sunset transition entry, making a separate
      rule redundant.
