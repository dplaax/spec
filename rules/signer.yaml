# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — signer (proof structure and signing obligations)
# File split is non-normative. Entry identity is carried by id (→ README.md).
rules:
  - id: signer.proof.structure
    status: draft
    class: core
    statement: >-
      A signer MUST attach a proof object conforming to W3C Data Integrity to
      the credential. The proof MUST include type, cryptosuite,
      verificationMethod, proofPurpose, and proofValue;
      verificationMethod MUST be resolvable to the signer DID Document.
    uses: []
    schemas: [pipeline-pass-credential.json]
    vectors: [signer-001]
    notes: >-
      Cryptosuite selection is declared by the wire profile; this catalog does
      not fix it. proofPurpose is assertionMethod. The presence of created is
      recommended but not required; however, if absent, the evaluation key for
      confidence.cryptosuite-lifecycle is unavailable and lifecycle evaluation
      cannot proceed (effectively fail-closed).

  - id: signer.cryptosuite.no-op-rejected
    status: draft
    class: core
    statement: >-
      A no-op identifier ("", "none", "null", "identity") MUST NOT be
      registered as a cryptosuite or canonicalization-spec identifier in the
      lifecycle registry. A verifier MUST reject these identifiers regardless
      of registry state.
    uses: [confidence.cryptosuite-lifecycle]
    schemas: []
    vectors: [signer-002, signer-003]
    notes: >-
      This is a structural closure against JOSE alg:none-class downgrades. The
      essence of that historical vulnerability was that "none" was a legitimate
      specified value — this rule permanently blocks the registration pathway
      (the normative path) for identifiers that claim to be no-ops, and the
      registry-independent rejection at verification time is a defense-in-depth
      layer against registry poisoning. A renamed no-op (an arbitrary
      identifier whose implementation skips verification) is outside the scope
      of this rule: if unregistered, confidence.cryptosuite-lifecycle rejects
      it fail-closed; if registered garbage, registry governance (append-only
      accountability, Sunset expiry, proof.created-keyed blast-radius
      calculation) applies. "" is the fail-closed case for zero values.
      Source: provin.oss vc/cryptosuite.go (applied at both registration and
      verification time).

  - id: signer.suite.eddsa-jcs-2022
    status: draft
    class: core
    statement: >-
      The eddsa-jcs-2022 suite MUST use jcs-rfc8785 canonicalization, a
      proof-local @context, Multikey verification methods, and MUST pass the
      official W3C key/algorithm test vectors; a proof lacking any of these MUST
      NOT be named eddsa-jcs-2022.
    uses: [signer.proof.structure, canon.jcs.base]
    schemas: []
    vectors: []
    notes: >-
      Fork W (user-selected): provin's active suite is the real W3C Data
      Integrity eddsa-jcs-2022 (Multikey, proof-local @context, official KAT), so
      an external W3C-DI verifier can verify the base signature. Provenance
      (chain / source commitment / scoped evidence vector) still needs provin's
      own evaluation.

  - id: signer.suite.eddsa-rdfc-2022
    status: draft
    class: core
    statement: >-
      The eddsa-rdfc-2022 suite MUST use urdna2015 canonicalization, a
      proof-local @context, Multikey verification methods, and MUST pass the
      official W3C test vectors; a proof lacking any of these MUST NOT be named
      eddsa-rdfc-2022.
    uses: [signer.proof.structure]
    schemas: []
    vectors: []
    notes: >-
      The Phase-2 opt-in W3C suite, v0-mandatory per the p0-7/p0-12 ruling and
      already anchored to the official vc-di-eddsa vectors with every
      intermediate pinned. Enumerated late: the P0-4 transcription covered only
      the eddsa-jcs-2022 identity split and left this production suite without
      a claim contract, which surfaced when the ForkW-1 exact dispatch rejected
      it (found by both implementation reviewers, 2026-07-15). RDF expansion
      needs the document @context anyway, so the proof-local mirror costs the
      suite nothing.

  - id: signer.suite.exact-dispatch
    status: draft
    class: core
    statement: >-
      A verifier MUST dispatch on the exact suite identifier and proof shape and
      MUST NOT try multiple canonicalizers or suites and accept whichever
      succeeds.
    uses: [signer.proof.structure]
    schemas: []
    vectors: []
    notes: >-
      Algorithm guessing would let a proof be validated under a suite it does not
      declare, laundering a legacy int64 proof into a standard claim or the
      reverse.

  - id: signer.suite.legacy-projection
    status: draft
    class: core
    statement: >-
      A historically-emitted eddsa-jcs-2022 proof in the closed int64 shape (JWK,
      no proof-local @context) MUST project to LEGACY_PROVIN_EDDSA_JCS_INT64 and
      MUST NOT be promoted to the W3C suite contract.
    uses: [signer.suite.eddsa-jcs-2022, canon.jcs.int64-verbatim]
    schemas: []
    vectors: []
    notes: >-
      The wire identifier eddsa-jcs-2022 historically named a non-standard
      (JWK, int64-verbatim) profile. The distinguisher between legacy and the
      W3C suite is the proof shape and key type (Multikey + @context), not the
      identifier string; the legacy shape maps to a distinct claim contract.

  - id: signer.suite.w3c-interop-gate
    status: draft
    class: core
    statement: >-
      Public Fork W issuance MUST be release-gated on passing the official W3C
      key and algorithm test vectors and on demonstrating interoperability with
      at least one external W3C Data Integrity verifier.
    uses: [signer.suite.eddsa-jcs-2022]
    schemas: []
    vectors: []
    notes: >-
      The official KAT pins the W3C transformation, hashing, and verification
      algorithms (so they are not restated as prose), and the external-verifier
      interoperability is the release blocker that makes the eddsa-jcs-2022 name
      honest: the suite is only conformant if a third party can verify it.
