# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — audit (responsibility attribution rules)
# File sharding is non-normative; an entry's identity is its id (see README.md).
rules:
  - id: audit.attribution.segment
    status: draft
    class: core
    statement: >-
      Attribution computation MUST attribute responsibility for the
      transformation a credential represents to the Owner DID reached from
      the credential's issuer through the controller chain.
    uses: [credential.field.issuer]
    schemas: []
    vectors: [audit-001]
    notes: >-
      The signing party is a Process DID; the responsible party is an
      organization (Owner). Reconstructability from Process to Owner is
      already required of verifiers by credential.field.issuer; this rule
      pins the destination of that reconstruction as the responsibility
      target.
      "Attribution computation" is the audit-side actor (see GLOSSARY):
      a deterministic function of chain topology that reads no payload
      content. These rules extend Paper 01's attestation scope ("who
      signed" / organizational attribution) to responsibility attribution;
      the destination (Owner) follows from credential.field.issuer's
      reconstructability requirement and the owner-whitelist trust model —
      grounded in this catalog, not an external paper. On the did:dplaax
      issuance plane the reconstruction is structural — the Owner is a prefix of
      the issuer DID, so it needs no resolution; methods outside that plane walk
      a controller chain.

  - id: audit.attribution.origin-default
    status: draft
    class: core
    statement: >-
      Attribution computation MUST attribute responsibility for all
      provenance preceding a chain origin to the Owner DID reached from the
      chain origin's issuer.
    uses: [chain.trigger.retention, commitment.class.definition]
    schemas: []
    vectors: [audit-002, audit-003, audit-004]
    notes: >-
      The default rule: whoever cuts the chain answers for what lies
      beyond the cut, unconditionally. A chain origin attests only to who
      emitted which bytes under which schema, claiming nothing about the
      world before ingestion — but claiming nothing is not an exemption.
      Chain preservation (chain.trigger.retention) is the only instrument
      that keeps upstream responsibility attached to upstream issuers,
      because then audit.attribution.segment covers those credentials. A
      source commitment under the audit-reachable class
      (commitment.class.definition) does NOT move this default: it proves
      what the origin claims to have consumed — the means to continue an
      investigation past the cut — never that the claim is complete, so
      it cannot safely shed the cutter's responsibility (an
      under-declared source set would otherwise launder liability).
      Boundary translation is an application of this rule, not an
      exception: responsibility for external input terminates at the
      ingesting Owner (audit-003). Deliberate extension beyond Paper 01
      §4.8's attestation scope ("what happened from the aggregation point
      onward, not what preceded"): the extension is grounded in the
      accountability-follows-the-last-cryptographic-link reasoning above,
      not an external paper.
