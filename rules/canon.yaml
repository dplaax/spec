# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — canonicalization / decoding
# ファイル分割は non-normative。entry の identity は id が担う (→ README.md)。
rules:
  - id: canon.jcs.base
    status: draft
    class: core
    statement: >-
      署名スコープおよび content hash の算出に用いる正規化は、RFC 8785 (JCS) に
      byte-for-byte 準拠したバイト列を生成しなければならない (MUST)。
      本 catalog における唯一の意図的逸脱は canon.jcs.int64-verbatim である。
    uses: []
    schemas: []
    vectors: [canon-001, canon-002, canon-003]
    notes: >-
      RFC 8785 準拠に含まれる落とし穴 (U+2028/U+2029 を raw UTF-8 で出力する、
      ES6 number 形式) は一般実装 (Go encoding/json 等) の既定挙動と異なるため、
      独立 rule ではなく本 rule の vector として固定する。

  - id: canon.jcs.int64-verbatim
    status: draft
    class: core
    statement: >-
      正規化器は、64bit 符号付きまたは符号なし整数として表現可能な整数リテラルを、
      IEEE double へのラウンドトリップを経ずに 10 進正準形 verbatim で
      出力しなければならない (MUST)。これは RFC 8785 の数値直列化規則
      (ES6 Number::toString) に対する意図的逸脱であり、2^53 超の整数精度を保持する。
    uses: [canon.jcs.base]
    schemas: []
    vectors: [canon-004]
    notes: >-
      2^53 超の整数は strict-ES6 な JCS 実装とは相互運用しない —
      発行者側の互換性留意点。decode 側の対称規則は canon.strict-decode の条件 (3)。

  - id: canon.jcs.reject-invalid-utf8
    status: draft
    class: core
    statement: >-
      正規化器は、文字列値またはオブジェクトキーが有効な UTF-8 でない入力に対して
      エラーを返さなければならず (MUST)、raw 出力や U+FFFD 置換によって
      処理を継続してはならない (MUST NOT)。
    uses: [canon.jcs.base]
    schemas: []
    vectors: [canon-005]
    notes: >-
      raw 出力は非 Unicode バイト列への署名を生み、U+FFFD 置換は相異なる
      キーの衝突 (非決定的な正準形) を生むため、いずれも fail-closed で拒否する。
      RFC 8785 は valid Unicode を前提としており、この拒否は準拠の範囲内。

  - id: canon.strict-decode
    status: draft
    class: core
    statement: >-
      プロトコル境界上の JSON デコードは、(1) 重複キーの拒否、(2) ドキュメント
      末尾の余剰データの拒否、(3) 2^53 超の整数精度を保持する数値表現、
      (4) 無効 UTF-8 バイト列および unpaired surrogate escape の拒否、
      の 4 条件をすべて満たさなければならない (MUST)。
    uses: []
    schemas: []
    vectors: [canon-006, canon-007, canon-008]
    notes: >-
      重複キー拒否の根拠は RFC 8785 §3.2.5。一般のデコーダは無効 UTF-8 と
      unpaired surrogate を U+FFFD へ無言置換するため、受信バイト列と正準 hash が
      乖離する — fail-closed で拒否する。条件 (3) は canon.jcs.int64-verbatim の
      decode 側対称。
