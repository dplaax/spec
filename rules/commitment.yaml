# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — commitment (source commitment / audit-reachable conformance class)
# File sharding is non-normative; an entry's identity is its id (see README.md).
rules:
  - id: commitment.class.definition
    status: draft
    class: audit-reachable
    statement: >-
      An issuer MAY attach a source commitment (derived_from, source_root,
      source_root_canonical) to any credential (audit-reachable class). It
      is an audit attribute orthogonal to previousCredential, not a parent
      link. A deployment profile MAY require the class.
    uses: [chain.trigger.retention]
    schemas: []
    vectors: [commitment-001]
    notes: >-
      "Any credential" means chain origins and chain-preserving credentials
      alike. Whether to emit is a deployment decision (config-driven). The
      wire profile itself does not demand the commitment — a deployment
      profile (e.g. a regulatory domain) does. The commitment guarantees
      only the binding to the claimed source set at issuance time; it does
      not guarantee completeness of the claim. Omission detection remains
      audit-layer reconciliation against ingress stores (the separation of
      integrity and completeness); the ingress store and the other transfer
      evidence records are defined in rules/transfer.yaml
      (transfer.ingress.retention / transfer.evidence.definition). The former
      name, origin commitment (a
      chain-origin-only conception), was reworked on 2026-06-11 — the name
      narrowed the attachment surface and made the consumed-source sets of
      chain-preserving boundaries invisible to audit (see STATUS.md).

  - id: commitment.scope.all-consumed
    status: draft
    class: audit-reachable
    statement: >-
      An attached source commitment MUST cover all conformant source
      credentials the execution consumed. On a chain-preserving credential
      the set includes the predecessor, and derived_from MUST contain its
      issuer. An empty set is legal only at a chain origin.
    uses: [commitment.class.definition, chain.trigger.retention]
    schemas: []
    vectors: [commitment-002]
    notes: >-
      A consequence of the audit-parity principle: as long as conformant
      sources are consumed, the trigger kind (the presence of
      previousCredential) does not change audit obligations. The trigger
      predecessor is also bound by the previousCredential hash; the overlap
      is harmless, and "derived_from contains the predecessor's issuer" works
      as an O(1) consistency check during chain verification. All-consumed is
      chosen over a trigger-excluded alternative (informationally minimal)
      because the definition is uniform and does not depend on trigger
      classification — higher decidability ("decidability over cleverness",
      see concept.md). Settled in the 2026-06-11 design discussion
      (the SourceCommitment rework).

  - id: commitment.derived-from
    status: draft
    class: audit-reachable
    statement: >-
      derived_from is a duplicate-free set of issuer DIDs; the issuer MUST
      serialize it in ascending lexicographic order. An empty set is legal
      and declares that no conformant upstream exists (chain origins only;
      see commitment.scope.all-consumed).
    uses: [commitment.class.definition, commitment.scope.all-consumed]
    schemas: []
    vectors: [commitment-003, commitment-004]
    notes: >-
      Multiple source credentials from the same issuer are legal —
      deduplication into the issuer set happens at issuance. For the
      consequences of issuer granularity, see the notes of
      commitment.verify.equality-fail-closed.

  - id: commitment.source-root.leaf
    status: draft
    class: audit-reachable
    statement: >-
      The issuer MUST compute each source_root leaf as
      SHA-256(0x00 ‖ canon(VC)), where canon(VC) is the canonical
      re-serialization of the signed source credential (body and proof) per
      source_root_canonical, and MUST sort leaves by SHA-256(canon(VC)).
    uses: [commitment.class.definition, canon.jcs.base]
    schemas: []
    vectors: [commitment-005]
    notes: >-
      canon(VC) is the re-canonicalized signed document: a verifier gathers
      each source (typically via a VC resolver, which serves canonical bytes
      — resolver.immutability) and re-serializes it with the canonicalization
      declared by source_root_canonical before hashing, so byte equality with
      what once travelled on the wire is not part of the definition. The
      pre-2026-07-02 wording "as-received signed wire form" meant "the signed
      document, not a pre-signing in-memory representation"; it did not mean
      byte-literalness — a literal-bytes reading is unimplementable through
      the audit path, where sources are only reconstructible in canonical
      form (full-review A-2). The sort key SHA-256(canon(VC)) is a
      full-document hash (proof included) over the same bytes as the leaf
      input; it is distinct from the proof-excluded content hash of
      credential.prev.content-hash / resolver.address.form.

  - id: commitment.source-root.tree
    status: draft
    class: audit-reachable
    statement: >-
      The issuer MUST sort leaves by sort key ascending and build internal
      nodes as SHA-256(0x01 ‖ left ‖ right) per the RFC 6962 §2.1 MTH. An odd
      leaf MUST be promoted, never duplicated. For an empty source set the
      root is the SHA-256 of the empty string.
    uses: [commitment.source-root.leaf]
    schemas: []
    vectors: [commitment-006]
    notes: >-
      The sort key is the full-document hash SHA-256(canon(VC)) defined by
      commitment.source-root.leaf. The earlier phrase "content hash" was
      dropped on 2026-07-02: elsewhere in the catalog that term names the
      proof-excluded address hash (credential.prev.content-hash /
      resolver.address.form), which is a different value. The left-subtree
      split is "the largest power of two smaller than n" (the k of RFC 6962
      §2.1). Making this split rule explicit is a precondition for
      recomputation agreement with verifiers.

  - id: commitment.source-root.encode
    status: draft
    class: audit-reachable
    statement: >-
      The issuer MUST encode the Merkle root as multihash sha2-256 (0x12 0x20)
      in multibase lowercase hex (f prefix), recording it as the string f1220
      followed by 64 hex characters. Verifiers SHOULD dispatch on the
      multihash prefix and reject unknown prefixes.
    uses: [commitment.source-root.tree]
    schemas: []
    vectors: [commitment-007]
    notes: >-
      The multihash/multibase form is pinned for cross-profile compatibility
      and is distinct from the sha256:<hex> content addresses used elsewhere —
      the same hash value in a different encoding will not match. Whether to
      raise the unknown-prefix rejection to a hard fail-closed requirement is
      undecided; the source texts are silent.

  - id: commitment.verify.equality-fail-closed
    status: draft
    class: audit-reachable
    statement: >-
      A verifier MUST return failed on duplicate derived_from entries,
      unknown source_root_canonical, a predecessor missing from the claimed
      issuers or gathered sources (content hash), or a root mismatch;
      indeterminate on a proper issuer subset; else verified.
    uses: [commitment.source-root.tree, commitment.derived-from, commitment.scope.all-consumed]
    schemas: []
    vectors: [commitment-008, commitment-009, commitment-010, commitment-011, commitment-013]
    notes: >-
      This verification sits outside the per-event path (an on-demand audit
      check). The missing-predecessor-issuer clause applies to chain-preserving
      VCs (whose derived_from must include the predecessor's issuer); the root
      comparison is against the RECOMPUTED root over the gathered sources.
      The predecessor matching can be performed more strongly than at
      issuer granularity — the verifier holds the previousCredential content
      hash, so once the claimed set is fully resolved it demands that some
      gathered source hashes to it (no match means the predecessor was
      omitted from the claim, hence failed). Only the
      predecessor-issuer-inclusion check is also an O(1) check during chain
      verification when adjacent credentials are at hand
      (commitment.scope.all-consumed). Incompleteness is detectable at issuer
      granularity only — a missing credential whose issuer is already covered
      by another provided source surfaces as a root mismatch (failed), not as
      indeterminate (a known limit of the commitment grammar).

  - id: commitment.store.persistence
    status: draft
    class: audit-reachable
    statement: >-
      In an audit-reachable deployment, the VC store MUST be a durable
      implementation. The commitment carries only the Merkle root and the
      issuer DID set; locating the source VCs is off-wire (via the issuer's
      VC store and the counterparties' ingress VC stores).
    uses: [commitment.class.definition]
    schemas: []
    vectors: [commitment-012]
    notes: >-
      Retrospective audits resolve source VCs long after issuance, which a
      volatile store cannot honor. The counterparties' ingress VC stores this
      references are defined by transfer.ingress.retention (rules/transfer.yaml),
      which fixes their byte-preserving / durable / audit-enumerable record
      property. The audit-facing enumeration query surface — an RPC a remote
      auditor calls — belongs to the service API layer, outside this catalog's
      scope (see STATUS.md); the record being enumerable and the query surface
      are the two sides transfer.ingress.retention keeps apart.
