# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — credential (エンベロープ / credentialSubject / 語彙)
# ファイル分割は non-normative。entry の identity は id が担う (→ README.md)。
rules:
  # ---- エンベロープ ----

  - id: credential.field.context
    status: draft
    class: core
    statement: >-
      PipelinePassCredential の @context は
      "https://www.w3.org/ns/credentials/v2" を第 1 要素として含まなければならず
      (MUST)、dplaax 語彙を宣言する profile 固有の context URI を
      含まなければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      W3C VC Data Model 2.0 採用の帰結。poc tier では context のバイトレベル進化が
      明示的に許容されており、GA 後の不変性は将来の関心事。profile 固有 context の
      実体 (JSON-LD 文書) は未決 (→ STATUS.md)。

  - id: credential.field.type
    status: draft
    class: core
    statement: >-
      type 配列は "VerifiableCredential" と "PipelinePassCredential" の両方を
      含まなければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: ""

  - id: credential.field.id
    status: draft
    class: core
    statement: >-
      エンベロープおよび credentialSubject の id は省略してよい (MAY)。
      検証器は id の不在を理由に拒否してはならない (MUST NOT)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      チェーンリンクは content-hash 経由で機能するため、安定識別子の発行基盤を
      持たない実装でも適合できる。

  - id: credential.field.issuer
    status: draft
    class: core
    statement: >-
      issuer は当該変換を実行した処理コンポーネントの Process DID で
      なければならない (MUST)。検証器はこの DID から controller チェーンを
      再構成し、責任組織の Owner DID に到達できなければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: DID method の選択は wire profile に委ねる。

  - id: credential.field.valid-from
    status: draft
    class: core
    statement: >-
      validFrom は存在すべきであり (SHOULD)、存在する場合は RFC 3339 UTC の
      秒精度タイムスタンプでなければならない (MUST)。サブ秒精度は発行時に
      切り捨てる。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      表すのは変換が証明された時刻であり、署名時刻ではない。cryptosuite lifecycle の
      判定キーは proof.created であって本 field ではない
      (→ confidence.cryptosuite-lifecycle)。

  - id: credential.field.subject
    status: draft
    class: core
    statement: >-
      credentialSubject は単一の JSON オブジェクトでなければならない (MUST)。
      配列および scalar は拒否しなければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: ""

  - id: credential.field.proof
    status: draft
    class: core
    statement: >-
      proof は単一の W3C Data Integrity proof オブジェクトでなければならず (MUST)、
      配列 (proof set) および scalar は拒否しなければならない (MUST)。proof は
      署名スコープである body の外に分離され、署名は body の正規化済み
      ダイジェストに対して行われなければならない (MUST)。
    uses: [signer.proof.structure, canon.jcs.base, credential.body-sot]
    schemas: []
    vectors: []
    notes: ""

  # ---- credentialSubject の field ----

  - id: credential.subject.pipeline-id
    status: draft
    class: core
    statement: >-
      credentialSubject.pipelineId は存在しなければならない (MUST)。
      当該プロセスが属するパイプラインの識別子であり、形式は wire profile の
      選択とする。
    uses: []
    schemas: []
    vectors: []
    notes: ""

  - id: credential.subject.process-id
    status: draft
    class: core
    statement: >-
      credentialSubject.processId は存在しなければならない (MUST)。
      パイプライン内で署名を行うプロセスの識別子であり、形式は wire profile の
      選択とする。
    uses: []
    schemas: []
    vectors: []
    notes: ""

  - id: credential.subject.transformation-type
    status: draft
    class: core
    statement: >-
      credentialSubject.transformationType は存在しなければならない (MUST)。
      値は transformationType 語彙規則に従わなければならない (MUST)。
    uses: [credential.transformation.base-vocabulary]
    schemas: []
    vectors: []
    notes: ""

  - id: credential.subject.input-hash
    status: draft
    class: core
    statement: >-
      credentialSubject.inputHash は存在しなければならない (MUST)。ただし集約による
      チェーン起点では、単一の入力が存在しないため省略してよい (MAY)。
      存在する場合、当該プロセスが消費した入力データの sha256:<hex> ダイジェストで
      なければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      集約起点での省略可は実装 SoT 側の確定事項で、旧 draft の「全 component type で
      必須」を上書きする。隣接クレデンシャル間の hash 連続性
      (outputHash と次の inputHash の一致) の規範化は未転記 (→ STATUS.md 未決)。

  - id: credential.subject.output-hash
    status: draft
    class: core
    statement: >-
      credentialSubject.outputHash は、パイプライン適合出力を生成する component
      type (FilterConvert、Origin Source) では存在しなければならない (MUST)。
      受領証を発行する External Sink では存在すべきである (SHOULD)。存在する場合、
      適合出力データの sha256:<hex> ダイジェストでなければならない (MUST)。
    uses: [component.catalog]
    schemas: []
    vectors: []
    notes: ""

  - id: credential.subject.previous-credential
    status: draft
    class: core
    statement: >-
      credentialSubject.previousCredential はチェーン継続クレデンシャルに
      存在しなければならない (MUST)。チェーン起点では省略するか null と
      しなければならない (MUST)。チェーンは厳密に線形であり、参照する先行者は
      高々 1 件でなければならない (MUST)。
    uses: [chain.trigger.retention, credential.prev.content-hash]
    schemas: []
    vectors: []
    notes: >-
      発行側 profile は省略形式を用いる。受理側は省略と null の両形式を等価に扱う。

  # ---- 表現・忠実性 ----

  - id: credential.body-sot
    status: draft
    class: core
    statement: >-
      署名スコープおよび hash 計算の唯一の情報源は canonical body で
      なければならない (MUST)。proof は body の外に分離しなければならない (MUST)。
      未知の signed-scope field は受信から再直列化までのラウンドトリップで
      保持しなければならない (MUST)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      設計動機: 二重 SoT (構造体 field と署名済み body) は無言の乖離 bug を生んだ
      前例があり、body 単一 SoT が再発を構造的に防ぐ。

  - id: credential.prev.content-hash
    status: draft
    class: core
    statement: >-
      previousCredential の値は、先行クレデンシャルの proof を除いた canonical
      body の正規化済みダイジェスト sha256:<hex> でなければならない (MUST)。
      名前ベース参照 (URN 等) を用いてはならない (MUST NOT)。
    uses: [canon.jcs.base, credential.body-sot]
    schemas: []
    vectors: []
    notes: >-
      長期監査と再現性には byte-exact な commitment が必要 — 名前参照は
      レジストリの消滅で破綻する。content-hash は resolver への問い合わせキーを
      兼ねる。旧 draft が profile 選択としていた URN 形式は採らない (確定)。

  - id: credential.proof.as-received
    status: draft
    class: core
    statement: >-
      実装は proof を wire で受信したままの raw JSON オブジェクトとして保持し、
      未知の proof メンバーを含めてラウンドトリップで保持しなければならない
      (MUST)。型付きビューへの変換は読み取り専用であり、raw 表現を置き換えては
      ならない (MUST NOT)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      動機は audit 再計算: source_root の leaf は as-received の VC (proof 含む)
      を hash するため (→ commitment.source-root.leaf)、proof の lossy な変換は
      再計算を破壊する。

  - id: credential.schema-ref
    status: draft
    class: core
    statement: >-
      スキーマ参照は credentialSubject 内の schema オブジェクトとして記録し、
      存在する場合は id (registry URI)・type (スキーマ言語)・contentHash
      (発行時点のスキーマの sha256:<hex>) の 3 field を含まなければならない
      (MUST)。検証器は registry からスキーマを解決して contentHash を照合し、
      不一致をデータ完全性軸の failed としなければならない (MUST)。
    uses: [registry.append-only, confidence.axes.three-state]
    schemas: []
    vectors: []
    notes: >-
      schema 参照の不在は許容 (存在すれば 3 field 必須)。content hash 照合により
      registry 側の遡及的スキーマ改変が検出可能になる。W3C VC Data Model の
      top-level credentialSchema 慣行から subject 内配置への逸脱は意図的逸脱として
      rationale 明記が未了 (→ STATUS.md 未決)。

  # ---- transformationType 語彙 ----

  - id: credential.transformation.base-vocabulary
    status: draft
    class: core
    statement: >-
      transformationType のベース語彙は filter・convert・aggregate の 3 値であり、
      組み合わせは "+" で結合した単一文字列でなければならない (MUST)。profile は
      <namespace>:<label> 形式の値で語彙を拡張してよい (MAY)。ベース語彙外の
      無印値を用いてはならず (MUST NOT)、ベース値の意味を再定義しては
      ならない (MUST NOT)。
    uses: []
    schemas: []
    vectors: []
    notes: >-
      ベース語彙は語彙安定までの暫定。生成的派生 (出力の情報源が入力集合に
      閉じない) の generate は provin:generate として profile 拡張で先行し、
      安定時に無印 generate のベース語彙昇格を提案する — 昇格時はエイリアス
      対応表を本 catalog に明記する。旧 draft の custom:<namespace>:<label>
      3 セグメント形式は採らず、2 セグメント形式に確定。

  - id: credential.transformation.aggregate-origin
    status: draft
    class: core
    statement: >-
      transformationType に aggregate を含むクレデンシャルはチェーン起点で
      なければならず (MUST)、inputHash および previousCredential を持っては
      ならない (MUST NOT)。
    uses: [credential.transformation.base-vocabulary, chain.trigger.retention]
    schemas: []
    vectors: []
    notes: 集約は常に新しいチェーンを開始する — 線形不変の帰結。

  - id: credential.transformation.open-world-namespaced
    status: draft
    class: core
    statement: >-
      検証器は、transformationType の未知の namespace-prefixed 値
      (`<namespace>:<label>` 形式) を opaque な準拠宣言として受理し、
      当該 credential の構造検証を継続しなければならない (MUST)。
    uses: [credential.transformation.base-vocabulary]
    schemas: []
    vectors: []
    notes: >-
      namespace-prefix 規則とこの entry および
      credential.transformation.open-world-bare が組になって、
      profile 間の縮退互換が成立する。2026-06-10 設計会話起点。

  - id: credential.transformation.open-world-bare
    status: draft
    class: core
    statement: >-
      検証器は、transformationType のベース語彙外かつ namespace prefix を
      持たない値を非準拠として拒否しなければならない (MUST)。
    uses: [credential.transformation.base-vocabulary]
    schemas: []
    vectors: []
    notes: >-
      credential.transformation.open-world-namespaced と対になる閉鎖則。
      2026-06-10 設計会話起点。
