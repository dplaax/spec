# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — credential (envelope / credentialSubject / vocabulary)
# File sharding is non-normative; an entry's identity is its id (see README.md).
rules:
  # ---- envelope ----

  - id: credential.field.context
    status: draft
    class: core
    statement: >-
      @context MUST contain "https://www.w3.org/ns/credentials/v2" first
      and MUST contain the dplaax protocol context URI. A profile MAY append
      an extension context for its own terms. contexts/ holds the canonical
      protocol context byte-for-byte.
    uses: []
    schemas: []
    vectors: [cred-001, cred-002]
    notes: >-
      A consequence of adopting the W3C VC Data Model 2.0. Ownership is
      two-layer (Model A, settled 2026-06-11): the protocol context (wire
      keys to IRIs, identical across profiles) plus profile extension
      contexts (custom subject fields only; @protected blocks redefinition
      of protocol terms). Implementations embed a byte-exact copy at compile
      time, guarded by a pinned-sha256 test against drift (see
      contexts/README.md). A profile extension context also carries the
      grounding of claim namespace prefixes — a credential emitting claims
      effectively carries a profile context via credential.claim.grounding.
      The URI is poc-tier (https://poc.dplaax.dev/vc/v1, byte-level evolution
      allowed); at GA it promotes to https://dplaax.dev/vc/v1 and freezes.

  - id: credential.field.type
    status: draft
    class: core
    statement: >-
      The type array MUST contain both "VerifiableCredential" and
      "PipelinePassCredential".
    uses: []
    schemas: []
    vectors: [cred-003]
    notes: ""

  - id: credential.field.id
    status: draft
    class: core
    statement: >-
      The id of the envelope and of credentialSubject MAY be omitted. A
      verifier MUST NOT reject a credential for the absence of id.
    uses: []
    schemas: []
    vectors: [cred-004]
    notes: >-
      Chain links work via content hashes, so implementations without a
      stable-identifier issuance infrastructure can still conform.

  - id: credential.field.issuer
    status: draft
    class: core
    statement: >-
      issuer MUST be the Process DID of the process that
      performed the transformation. A verifier MUST be able to reconstruct
      the controller chain from this DID to the responsible organization's
      Owner DID.
    uses: []
    schemas: []
    vectors: [cred-005]
    notes: The choice of DID method is left to the wire profile.

  - id: credential.field.valid-from
    status: draft
    class: core
    statement: >-
      validFrom SHOULD be present, and when present MUST be an RFC 3339 UTC
      timestamp at second precision. Receivers MUST reject fractional seconds
      (issuers truncate before emission) and the -00:00 unknown-local-offset
      form, which does not assert UTC.
    uses: []
    schemas: []
    vectors: [cred-006, cred-007, cred-030, cred-031, cred-032]
    notes: >-
      It expresses when the transformation was attested, not when it was
      signed. The cryptosuite-lifecycle evaluation key is proof.created, not
      this field (see confidence.cryptosuite-lifecycle).

  - id: credential.field.subject
    status: draft
    class: core
    statement: >-
      credentialSubject MUST be a single JSON object. Arrays and scalars
      MUST be rejected.
    uses: []
    schemas: []
    vectors: [cred-008]
    notes: ""

  - id: credential.field.proof
    status: draft
    class: core
    statement: >-
      proof MUST be a single W3C Data Integrity proof object; arrays (proof
      sets) and scalars MUST be rejected. proof is kept outside the signing
      scope (the body), and the signature MUST be computed over the body's
      canonicalized digest.
    uses: [signer.proof.structure, canon.jcs.base, credential.body-sot]
    schemas: []
    vectors: [cred-009]
    notes: ""

  # ---- credentialSubject fields ----

  - id: credential.subject.pipeline-id
    status: draft
    class: core
    statement: >-
      credentialSubject.pipelineId MUST be present. It identifies the
      pipeline the process belongs to; its format is the wire profile's
      choice.
    uses: []
    schemas: []
    vectors: [cred-010]
    notes: ""

  - id: credential.subject.process-id
    status: draft
    class: core
    statement: >-
      credentialSubject.processId MUST be present. It identifies the signing
      process within the pipeline; its format is the wire profile's choice.
    uses: []
    schemas: []
    vectors: [cred-011]
    notes: ""

  - id: credential.subject.transformation-claim
    status: draft
    class: core
    statement: >-
      credentialSubject.transformationClaim MUST be present. Its value MUST
      follow the claim grammar rules.
    uses: [credential.claim.grammar]
    schemas: []
    vectors: [cred-012]
    notes: ""

  - id: credential.subject.input-hash
    status: draft
    class: core
    statement: >-
      When present, credentialSubject.inputHash MUST be the sha256:<hex>
      digest of the consumed input. A chain origin SHOULD include it exactly
      when a single input exists.
    uses: []
    schemas: []
    vectors: [cred-013, cred-014]
    notes: >-
      Rewritten 2026-07-02 (full-review B-3). The earlier "must be present,
      except a chain origin produced by aggregation" was unverifiable from
      the wire: "produced by aggregation" is a claim-level (profile) concept,
      and credential.claim.open-world-accept forbids a verifier from drawing
      closed-world inferences from an unrecognized claim — so a cross-profile
      verifier could never decide whether the exception applied, and the
      unconditional presence obligation was unenforceable (the reference
      implementation never enforced it). Presence on chain-preserving
      credentials is enforced by chain.data-flow.continuity, not here: the
      continuity equality outputHash[n] = inputHash[n+1] cannot hold against
      an absent value, so chain verification fails (chain-008) — presence is
      effectively mandatory there without a separate check. (The pointer
      lives in these notes rather than in uses or the statement: continuity
      already uses this rule for the field definition, and a reverse edge
      would make the dependency graph cyclic.) At a chain origin presence is
      issuance guidance keyed to whether a single input exists (e.g. an
      aggregation has none — cred-013), which only the issuer can know. The
      format obligation (cred-014) is the wire-checkable residue. The
      aggregation-origin omission is settled on the implementation
      source-of-truth side and overrides the old draft's "mandatory for all
      component types" (old-draft vocabulary; now process types).

  - id: credential.subject.output-hash
    status: draft
    class: core
    statement: >-
      credentialSubject.outputHash MUST be present on process types
      producing pipeline-conformant output (Chained Process, Source Process)
      and SHOULD be present on Sink Process receipts. When present it MUST
      be the sha256:<hex> digest of the conformant output.
    uses: [process.catalog]
    schemas: []
    vectors: [cred-015]
    notes: >-
      Content hashes are integrity commitments, not confidentiality
      (documented property, settled 2026-06-11): a digest over a
      low-entropy value space (a boolean verdict, a small enum, a bounded
      counter) is dictionary-recoverable by any observer who can enumerate
      the space. This holds for every content commitment in the model
      (inputHash, previousCredential, source_root leaves), and the wire
      shape deliberately does not change for it — payloads whose contents
      must stay unguessable carry issuer-chosen salt inside the payload
      bytes, a payload-schema concern pinned via the schema reference
      (credential.schema-ref), invisible to the wire.

  - id: credential.subject.previous-credential
    status: draft
    class: core
    statement: >-
      credentialSubject.previousCredential MUST be present on
      chain-continuing credentials. At a chain origin it MUST be omitted or
      null. The chain is strictly linear: a credential MUST reference at most
      one predecessor.
    uses: [chain.trigger.retention, credential.prev.content-hash]
    schemas: []
    vectors: [cred-016]
    notes: >-
      Issuing profiles use the omitted form. Receivers treat omission and
      null as equivalent.

  # ---- representation and fidelity ----

  - id: credential.body-sot
    status: draft
    class: core
    statement: >-
      The canonical body MUST be the sole source of truth for the signing
      scope and for hash computation. proof MUST be kept outside the body.
      Unknown signed-scope fields MUST survive the receive-to-reserialize
      round-trip.
    uses: []
    schemas: []
    vectors: [cred-017]
    notes: >-
      Design motivation: a dual source of truth (struct fields plus a signed
      body) has previously produced silent-divergence bugs; a single body
      source of truth structurally prevents recurrence.

  - id: credential.prev.content-hash
    status: draft
    class: core
    statement: >-
      The value of previousCredential MUST be the canonicalized digest
      sha256:<hex> of the predecessor's canonical body excluding proof.
      Name-based references (URNs and the like) MUST NOT be used.
    uses: [canon.jcs.base, credential.body-sot]
    schemas: []
    vectors: [cred-018, cred-019]
    notes: >-
      Long-horizon audits and reproducibility need a byte-exact commitment —
      a name reference breaks when its registry disappears. The content hash
      doubles as the resolver lookup key. The URN form the old draft left as
      a profile choice is not adopted (settled).

  - id: credential.proof.as-received
    status: draft
    class: core
    statement: >-
      Implementations MUST retain proof as the raw JSON object received on
      the wire, preserving unknown proof members across round-trips.
      Conversion to a typed view is read-only and MUST NOT replace the raw
      representation.
    uses: []
    schemas: []
    vectors: [cred-020]
    notes: >-
      The motivation is audit recomputation: source_root leaves hash the
      canonical re-serialization of the signed VC including proof (see
      commitment.source-root.leaf), so a lossy proof transformation changes
      the re-serialized bytes and breaks recomputation. Retaining the raw
      proof object is what makes that re-serialization faithful.

  - id: credential.schema-ref
    status: draft
    class: core
    statement: >-
      A schema reference is the schema object in credentialSubject; when
      present it MUST contain id (registry URI), type (schema language),
      and contentHash (sha256:<hex>). A verifier MUST resolve and compare
      contentHash, failing data-integrity on mismatch.
    uses: [registry.append-only, confidence.axes.three-state]
    schemas: []
    vectors: [cred-021, cred-022]
    notes: >-
      Absence of the schema reference is acceptable (all three fields are
      needed once the object is present). contentHash is the digest of the
      schema as registered at issuance time, resolved from the registry for
      comparison. Content-hash comparison makes retroactive schema
      modification on the registry side detectable. The placement inside the
      subject is a deliberate divergence from the W3C VC Data Model's
      top-level credentialSchema convention (rationale settled 2026-06-11):
      W3C credentialSchema declares the schema of the credential itself — a
      processing directive for VC tooling — whereas this object names the
      schema of the data the subject attests about (the registered output
      schema). It is part of the attested claim set: the issuer asserts, in
      signed scope alongside outputHash, which shape the output bytes
      conform to. Reusing the top-level W3C term for payload-schema
      semantics would invite conformant VC processors to validate the
      credential envelope against a data schema; the deviation keeps the
      envelope purely W3C-vocabulary (the protocol context wires subject
      terms only — see credential.field.context, Model A).

  # ---- transformationClaim (claim grammar and open-world interpretation) ----

  - id: credential.claim.grammar
    status: draft
    class: core
    statement: >-
      transformationClaim MUST be a single value of the form
      <namespace>:<label>. dplaax does not define claim semantics — pinning
      meaning (closed/open world, content relationship) is the profile's
      job.
    uses: []
    schemas: []
    vectors: [cred-023]
    notes: >-
      Reworked 2026-06-11. Shape (previousCredential x source commitment) is
      self-evident from wire parameters, so the field's non-redundant job is
      the claim about the output's information source — the former name
      transformationType invited confusion with the shape axis and was
      renamed. The former base vocabulary (filter / convert / aggregate)
      moved to the provin profile (provin:filter etc.; bare values are gone
      entirely). The "+" join is removed — composites are single profile
      labels (e.g. provin:filter-convert). Both are deliberate divergences
      from Paper 01 §4.3 (base vocabulary plus "+" joins). The former
      aggregate-origin rule (topology bound by claim) is deleted — topology
      is decided by chain.trigger.* alone (claims do not bind topology,
      settled 2026-06-11).

  - id: credential.claim.charset
    status: draft
    class: core
    statement: >-
      Within a transformationClaim, namespace and label MUST NOT contain
      white-space characters (Unicode White_Space), control characters
      (Cc), format characters (Cf), or "+", as assigned in Unicode 15.0. A
      credential violating this MUST be rejected.
    uses: [credential.claim.grammar]
    schemas: []
    vectors: [cred-028, cred-029]
    notes: >-
      Pinned 2026-06-11 (previously an implementation judgment in
      provin.oss vc/claim.go; unpinned charset = per-implementation
      acceptance differences = a partition trap). Invisible and
      bidirectional-control characters (Cf) enable display-spoofed claims
      that are distinct signed bytes; "+" is reserved away so the removed
      join syntax (credential.claim.grammar notes) cannot be resurrected
      as ad-hoc structure inside a label. The property snapshot is pinned
      to Unicode 15.0 (the table set shipped by the reference toolchain):
      implementations judge the classes by 15.0 assignments even when
      their runtime ships newer tables — otherwise a newly assigned Cf
      code point would be accepted by older runtimes and rejected by newer
      ones, recreating the very partition this rule closes. Bumping the
      snapshot is a spec change (0.x minor). Code points beyond these
      classes (case variants, non-ASCII letters, unassigned and
      private-use code points) are deliberately left to profiles: claim
      identity is byte comparison of (grounding URL, label), so broader
      acceptance differences fragment which tokens are issuable, never how
      an issued token is interpreted.

  - id: credential.claim.open-world-accept
    status: draft
    class: core
    statement: >-
      A verifier MUST accept an otherwise-conformant but unrecognized
      transformationClaim value as an opaque conformance declaration and
      continue structural verification. It MUST NOT draw closed-world
      inferences from an unrecognized claim.
    uses: [credential.claim.grammar]
    schemas: []
    vectors: [cred-025]
    notes: >-
      Closed-world inference means the exclusion inference that source_root
      is the entirety of the output's information sources ("X absent from
      the claimed set did not contribute"). The inclusion direction (the
      binding of claimed-source consumption, tamper evidence) holds
      regardless of claim recognition; only the exclusion inference is lost.
      Treating unknown as closed would let an auditor issue a false
      clearance, so the strong conclusion (exclusion) demands positive
      recognition of the claim's meaning — a rule of the fail-closed family.
      The unit of "recognition" is the (grounding URL, label) pair (see
      credential.claim.grounding). Cross-profile graceful degradation is
      established by this entry together with credential.claim.bare-rejected.
      Originates in the 2026-06-10 design discussion; the interpretation
      default was added 2026-06-11.

  - id: credential.claim.bare-rejected
    status: draft
    class: core
    statement: >-
      A verifier MUST reject a transformationClaim value without a namespace
      prefix as non-conformant.
    uses: [credential.claim.grammar]
    schemas: []
    vectors: [cred-024]
    notes: >-
      The closure rule paired with credential.claim.open-world-accept. The
      former rule allowed only the three base-vocabulary values to go bare;
      the base-vocabulary dissolution (2026-06-11) abolished bare values
      entirely.

  - id: credential.claim.grounding
    status: draft
    class: core
    statement: >-
      The issuer MUST ground the namespace prefix of transformationClaim via
      a context document in @context that maps the prefix to a URL. Claim
      identity is the (grounding URL, label) pair. A verifier MUST reject an
      ungrounded claim as non-conformant.
    uses: [credential.claim.grammar, credential.field.context]
    schemas: []
    vectors: [cred-026, cred-027]
    notes: >-
      Solves the bare-prefix collision problem (who owns the string
      "provin"). The same prefix under a different grounding URL is a
      different claim, so an impostor is byte-distinguishable inside the
      signing scope. Whether grounding exists is a structural check needing
      no profile knowledge (fail-closed); an unknown grounding URL falls to
      credential.claim.open-world-accept (open world). The former ledger
      item "mandatory profile identification" is resolved as this grounding
      coherence rule rather than an identity marker (2026-06-11 design
      discussion) — a namespace names the semantic authority, not the
      emitter's affiliation, and a compatible profile can emit another
      namespace's claims under their pinned meaning (falsehoods are
      attributable).
