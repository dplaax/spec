# yaml-language-server: $schema=../tools/rule.schema.json
# dplaax rule catalog — component (component type catalog)
# File split is non-normative. Entry identity is carried by id (→ README.md).
rules:
  - id: component.catalog
    status: draft
    class: core
    statement: >-
      An implementation that issues PipelinePassCredentials MUST conform to
      one of the four catalog types: FilterConvert, Origin Source, External
      Sink, or Custom. A component claiming a catalog type MUST conform to the
      contract of that type.
    uses: []
    schemas: []
    vectors: [component-001]
    notes: >-
      The four types are peers; no type is privileged. A component's type is
      determined by its wire signing behavior (whether it issues a chain-origin
      credential or carries previousCredential), not by its deployment name or
      placement. Extensions go through Custom.

  - id: component.filter-convert.stateless
    status: draft
    class: core
    statement: >-
      FilterConvert MUST be a stateless 1:1 transformation. Aggregation,
      join, window, or other chain-stateful processing MUST NOT be executed as
      a FilterConvert.
    uses: [component.catalog, chain.trigger.retention]
    schemas: []
    vectors: [component-002]
    notes: >-
      Chain behavior is governed by trigger rules, not type (confirmed
      2026-06-11) — the old-draft type-based rule "FilterConvert is prohibited
      from issuing chain-origin credentials" is not adopted. Output from
      non-event-triggered execution becomes a chain origin per trigger rules,
      and its signing behavior is classified as Origin Source. The Filter /
      Converter step role is an internal mechanism and does not appear on the
      wire. On filter drop, no output credential is emitted (or a credential
      with no outputHash per profile selection). Typical transformationClaim
      values: provin:filter / provin:convert / provin:filter-convert (composite
      defined as a single label by the profile). Side-fetch enrichment bound to
      a trigger event uses provin:enrich and retains the chain.

  - id: component.origin-source.firstdrop
    status: draft
    class: core
    statement: >-
      Origin Source MUST issue chain-origin credentials. Its defining property
      is solely the issuance of chain-origin credentials; it MAY accept zero
      or more conformant input streams.
    uses: [component.catalog, chain.trigger.retention]
    schemas: []
    vectors: [component-003]
    notes: >-
      External ingestion (N=0, typical provin:convert), aggregation
      (N>=1, provin:aggregate), and boundary translation (re-signing
      non-conformant credentials) are all Origin Source behaviors. The
      old-draft exclusive rule "the only type that may issue chain-origin
      credentials" is replaced by trigger-based classification (confirmed
      2026-06-11). Source commitments for the audit-reachable class are
      specified in rules/commitment.yaml.

  - id: component.external-sink.verify
    status: draft
    class: core
    statement: >-
      External Sink MUST verify the received credential chain regardless of
      whether it issues a receipt credential.
    uses: [component.catalog, confidence.composition.weakest-link]
    schemas: []
    vectors: [component-004]
    notes: >-
      The conformance obligation for an External Sink is on the input side
      only — its output goes to an external system and is not a pipeline
      conformance obligation. Its role is delivery, not proof of
      transformation.

  - id: component.external-sink.receipt
    status: draft
    class: core
    statement: >-
      A wire profile MAY permit an External Sink to issue a delivery receipt
      credential. Any issued receipt MUST conform to the PipelinePassCredential
      schema and MUST reference the last upstream credential via
      previousCredential.
    uses: [component.external-sink.verify, credential.subject.previous-credential]
    schemas: []
    vectors: [component-005]
    notes: >-
      By default an External Sink does not issue credentials; the chain
      terminates at the last upstream credential. Example transformationClaim
      for a receipt: provin:external-sink-receipt (the old-draft value
      custom:dplaas:external-sink-receipt is superseded by the two-segment
      rule and the provin namespace, confirmed 2026-06-11).

  - id: component.custom.interop
    status: draft
    class: core
    statement: >-
      A Custom component MUST NOT carry previousCredential when issuing a
      chain-origin credential, MUST retain previousCredential when continuing
      a chain, and MUST verify the received chain before terminating it.
    uses: [component.catalog, chain.trigger.retention, credential.subject.previous-credential, credential.claim.grammar]
    schemas: []
    vectors: [component-006]
    notes: >-
      Prerequisite is conformance to the Pipeline Contract (at least one I/O
      side performs pipeline-conformant signing and VC wrapping). Custom
      subject fields must be documented in the schema registry entry for the
      profile. The verifier's treatment of unknown transformationClaim values
      is governed by the open-world rules (credential.claim.open-world-accept /
      credential.claim.bare-rejected); the old-draft informational treatment
      (weak rule) is not adopted.
