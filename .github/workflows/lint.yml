name: lint

on:
  push:
    branches: [poc, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Required: the spec's own SoT discipline — RFC 2119 keyword placement, rule
  # id uniqueness/format, uses/schemas/vectors reference resolution, status/class
  # enums, and the rule<->vector bidirectional reference check.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pyyaml 'jsonschema[format-nongpl]'
      - name: spec lint
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The ref the change is made against, so that the lint can check that
          # no branch-context snapshot shipped there has changed.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            export DPLAAX_BASE_REF="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            export DPLAAX_BASE_REF="$BEFORE"
          fi
          python tools/lint.py
      - name: vector-vs-schema validation
        run: python tools/validate_vectors.py
      - name: independent EvidenceView vectors
        run: python tools/verify_evidence_vectors.py
