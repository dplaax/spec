name: lint

on:
  push:
    branches: [poc, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Required: the spec's own SoT discipline — RFC 2119 keyword placement, rule
  # id uniqueness/format, uses/schemas/vectors reference resolution, status/class
  # enums, and the rule<->vector bidirectional reference check.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pyyaml
      - name: spec lint
        run: python tools/lint.py

  # Advisory (non-blocking): does this PR's vector set still run against the
  # current provin.oss conformance harness? Sync the PR's vectors into a fresh
  # oss checkout and run the coverage-guarded harness. A red here means the oss
  # side has driver/skip work waiting for a vector added or changed here — an
  # early signal, NOT a merge blocker. The spec's evolution is not gated on the
  # implementation's catch-up (push-based sync doctrine; see conformance/README).
  oss-harness-crosscheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: checkout spec (this PR)
        uses: actions/checkout@v4
        with:
          path: spec
      - name: checkout provin.oss (default branch)
        uses: actions/checkout@v4
        with:
          repository: provin-line/oss
          path: oss
      - uses: actions/setup-go@v5
        with:
          go-version-file: oss/go.mod
          cache: true
      - name: sync this PR's vectors into the oss harness
        working-directory: oss
        run: scripts/sync-spec-vectors.sh ../spec
      - name: run the coverage-guarded harness
        working-directory: oss
        run: go test ./conformance/ -run TestDplaaxAllVectors -v
